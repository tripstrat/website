<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 510px;
      height: 765px;
      overflow: hidden;
      background: #fffcf6;
      color: #1f2a27;
      font-family: "Outfit", system-ui, sans-serif;
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
    }
    .page {
      position: relative;
      width: 510px;
      height: 765px;
      padding: 48px 40px 40px;
      background: #fffcf6;
      overflow: hidden;
    }
    .serif { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 400; }
    .label {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #004f4f;
    }
    .title {
      margin-top: 18px;
      font-size: 42px;
      line-height: 1.08;
      color: #004f4f;
      max-width: 320px;
    }
    .rule {
      width: 48px;
      height: 1px;
      background: #ded4c3;
      margin: 18px 0;
    }
    .subtitle {
      font-size: 14px;
      line-height: 1.65;
      color: #5f6f6c;
      max-width: 280px;
    }
    .photo {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 200px;
      height: 420px;
      object-fit: cover;
      object-position: center;
    }
    .photo-wide {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 280px;
      object-fit: cover;
      object-position: center 40%;
      mask-image: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.55) 55%, transparent 100%);
      -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.55) 55%, transparent 100%);
    }
    .fade {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, #fffcf6 0%, #fffcf6 52%, rgba(255,252,246,0.72) 68%, rgba(255,252,246,0.15) 100%);
      pointer-events: none;
    }
    .list { margin-top: 36px; max-width: 290px; position: relative; z-index: 2; }
    .item {
      padding: 16px 0;
      border-top: 1px solid #ded4c3;
    }
    .item:last-child { border-bottom: 1px solid #ded4c3; }
    .item-head {
      display: flex;
      gap: 12px;
      align-items: baseline;
    }
    .num {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 18px;
      color: #004f4f;
      min-width: 28px;
    }
    .item-title {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 20px;
      color: #1f2a27;
      line-height: 1.2;
    }
    .item-title.caps {
      font-family: "Outfit", system-ui, sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #004f4f;
    }
    .item-body {
      margin-top: 6px;
      margin-left: 40px;
      font-size: 12.5px;
      line-height: 1.55;
      color: #5f6f6c;
    }
    .timeline { margin-top: 40px; max-width: 270px; position: relative; z-index: 2; }
    .timeline::before {
      content: "";
      position: absolute;
      left: 5px;
      top: 8px;
      bottom: 8px;
      width: 1px;
      background: #ded4c3;
    }
    .t-item {
      position: relative;
      padding-left: 28px;
      margin-bottom: 26px;
    }
    .t-item::before {
      content: "";
      position: absolute;
      left: 1px;
      top: 7px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #004f4f;
    }
    .t-label {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 22px;
      color: #004f4f;
      line-height: 1.1;
    }
    .t-body {
      margin-top: 6px;
      font-size: 12.5px;
      line-height: 1.55;
      color: #5f6f6c;
    }
  </style>
</head>
<body>
<!-- pages are separate files -->
</body>
</html>
